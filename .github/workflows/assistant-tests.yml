name: assistant tests

on:
  push:
    paths: ["assistant/**", ".github/workflows/assistant-tests.yml"]
  pull_request:
    paths: ["assistant/**", ".github/workflows/assistant-tests.yml"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
